name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project inchspace.xcodeproj \
            -scheme inchspace \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build and run unit tests without signing
        run: |
          set -o pipefail
          xcodebuild test \
            -project inchspace.xcodeproj \
            -scheme inchspace \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-diagnostics
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 7

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new vX.Y.Z tag for the legacy Ad-hoc release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and publish
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must exactly match vX.Y.Z using numeric components." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
          /opt/homebrew/bin/gh --version

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project inchspace.xcodeproj \
            -scheme inchspace \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Run all unit tests
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project inchspace.xcodeproj \
            -scheme inchspace \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ReleaseTestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/xcodebuild-release-test.log"

      - name: Build universal ad-hoc signed archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project inchspace.xcodeproj \
            -scheme inchspace \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/inchspace.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/ArchiveDerivedData" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Validate archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/inchspace.xcarchive/Products/Applications/inchspace.app"
          info="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/inchspace"

          test -d "$app"
          test -f "$info"
          test -x "$executable"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" == "vip.lylab.inchspace" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" == "$RELEASE_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" == "$BUILD_NUMBER" ]]

          codesign --verify --deep --strict --verbose=2 "$app"
          entitlements="$RUNNER_TEMP/inchspace-entitlements.plist"
          codesign -d --entitlements :- "$app" > "$entitlements"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements")" == "true" ]]
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$entitlements" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' "$entitlements" >/dev/null

          architectures="$(lipo -archs "$executable")"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]

      - name: Package and verify release DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/ReleaseFiles"
          dmg_root="$RUNNER_TEMP/DmgRoot"
          mount_point="$RUNNER_TEMP/DmgMount"
          source_app="$RUNNER_TEMP/inchspace.xcarchive/Products/Applications/inchspace.app"
          dmg="$release_dir/inchspace-$RELEASE_VERSION.dmg"
          mounted_device=""

          cleanup() {
            if [[ -n "$mounted_device" ]]; then
              hdiutil detach "$mounted_device" || true
            fi
          }
          trap cleanup EXIT

          mkdir -p "$release_dir" "$dmg_root" "$mount_point"
          ditto "$source_app" "$dmg_root/inchspace.app"
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create \
            -volname "inchspace $RELEASE_VERSION" \
            -srcfolder "$dmg_root" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            "$dmg"
          hdiutil verify "$dmg"

          attach_output="$(hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg")"
          mounted_device="$(awk '/^\/dev\// { print $1; exit }' <<< "$attach_output")"
          [[ -n "$mounted_device" ]]
          test -d "$mount_point/inchspace.app"
          test -L "$mount_point/Applications"
          [[ "$(readlink "$mount_point/Applications")" == "/Applications" ]]
          codesign --verify --deep --strict --verbose=2 "$mount_point/inchspace.app"

          hdiutil detach "$mounted_device"
          mounted_device=""
          trap - EXIT

          cd "$release_dir"
          shasum -a 256 "inchspace-$RELEASE_VERSION.dmg" \
            > "inchspace-$RELEASE_VERSION.dmg.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          /opt/homebrew/bin/gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/ReleaseFiles/inchspace-$RELEASE_VERSION.dmg" \
            "$RUNNER_TEMP/ReleaseFiles/inchspace-$RELEASE_VERSION.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "inchspace $RELEASE_VERSION" \
            --generate-notes

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ReleaseTestResults.xcresult
            ${{ runner.temp }}/xcodebuild-release-test.log
            ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7
